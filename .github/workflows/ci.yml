name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.routes.outputs.contract }}
      linux_unit: ${{ steps.routes.outputs.linux_unit }}
      linux_gtk: ${{ steps.routes.outputs.linux_gtk }}
      windows: ${{ steps.routes.outputs.windows }}
      macos: ${{ steps.routes.outputs.macos }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install instruction-check dependency
        run: python -m pip install --requirement ci/requirements-plan.txt

      - name: Test CI routing and aggregation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python ci/check_instructions.py test
          python ci/check_instructions.py check
          python ci/test_plan.py
          python ci/test_required.py

      - name: Plan routes
        id: routes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python ci/plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  contract:
    name: contract
    needs: plan
    if: ${{ needs.plan.outputs.contract == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install contract dependency
        run: python -m pip install --requirement ci/requirements-contract.txt

      - name: Check schemas and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python schema/check.py

      - name: Test the result validator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python windows/bench/test_validate_result_v1.py

      - name: Validate committed result documents
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mapfile -d '' result_documents < <(
            find . -type f -path '*/bench/results/*.json' ! -name '*.raw.json' -print0 | sort -z
          )
          if (( ${#result_documents[@]} == 0 )); then
            echo "no result documents found" >&2
            exit 1
          fi
          python windows/bench/validate_result_v1.py . "${result_documents[@]}"

  linux_unit:
    name: linux_unit
    needs: plan
    if: ${{ needs.plan.outputs.linux_unit == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check Linux build script syntax
        run: |
          sh -n linux/gtk4/hello/build.sh
          sh -n linux/keld/hello/build.sh

      - name: List Linux metrics
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python linux/bench/run.py list-metrics

      - name: Test Linux harness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python linux/bench/test_harness.py

  linux_gtk:
    name: linux_gtk
    needs: plan
    if: ${{ needs.plan.outputs.linux_gtk == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install GTK fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            apparmor \
            apparmor-profiles \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libgl1-mesa-dri \
            xvfb \
            xauth \
            dbus-x11

      - name: Load Ubuntu's Bubblewrap user-namespace profile
        run: |
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -r "$profile"
          sudo apparmor_parser --replace "$profile"

      - name: Build GTK fixture
        run: sh linux/gtk4/hello/build.sh "$RUNNER_TEMP/gtk4-fixture"

      - name: Test GTK fixture on a real display server
        env:
          GTK4_FIXTURE_ARTIFACT: ${{ runner.temp }}/gtk4-fixture/gtk4-webkit-hello
          GTK4_FIXTURE_REAL: "1"
          GDK_BACKEND: x11
          GTK_A11Y: none
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: dbus-run-session -- xvfb-run --auto-servernum python linux/gtk4/hello/test_fixture.py

  windows:
    name: windows
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $parseErrors = @(
            Get-ChildItem -Path . -Filter '*.ps1' -File -Recurse | ForEach-Object {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              $errors
            }
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List -Force | Out-String | Write-Error
            throw "$($parseErrors.Count) PowerShell parse error(s)"
          }

      - name: Test Windows harness
        shell: pwsh
        run: ./windows/bench/Test-Harness.ps1

      - name: Test published measurements
        shell: pwsh
        run: ./windows/bench/Test-PublishedMeasurements.ps1

  macos:
    name: macos
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint native fixture property lists
        run: |
          plutil -lint macos/swift/appkit-wk/Info.plist
          plutil -lint macos/swift/swiftui-wk/Info.plist

      - name: Compile native Swift fixtures
        run: |
          host_arch="$(uname -m)"
          swiftc -parse-as-library -O \
            -target "${host_arch}-apple-macos14.0" \
            -framework AppKit -framework WebKit \
            macos/swift/appkit-wk/HelloAppKit.swift \
            -o "$RUNNER_TEMP/HelloAppKit"
          swiftc -parse-as-library -O \
            -target "${host_arch}-apple-macos14.0" \
            -framework SwiftUI -framework WebKit \
            macos/swift/swiftui-wk/HelloSwiftUI.swift \
            -o "$RUNNER_TEMP/HelloSwiftUI"

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the exact historical exception
        env:
          GITLEAKS_IGNORE_SHA256: ${{ vars.GITLEAKS_IGNORE_SHA256 }}
        run: |
          echo "$GITLEAKS_IGNORE_SHA256  .gitleaksignore" | sha256sum --check --strict
          mutated_ignore="$RUNNER_TEMP/gitleaksignore-mutated"
          cp .gitleaksignore "$mutated_ignore"
          printf '%s\n' 'unauthorized-fingerprint' >> "$mutated_ignore"
          if echo "$GITLEAKS_IGNORE_SHA256  $mutated_ignore" \
            | sha256sum --check --strict >/dev/null 2>&1; then
            echo "mutated gitleaks exception unexpectedly passed" >&2
            exit 1
          fi

      - name: Install checksum-pinned gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          install -d "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version

      - name: Scan full history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --verbose --redact --exit-code 1

  required:
    name: required
    if: ${{ always() }}
    needs:
      - plan
      - contract
      - linux_unit
      - linux_gtk
      - windows
      - macos
      - secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require exactly the planned jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CONTRACT_REQUESTED: ${{ needs.plan.outputs.contract }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          LINUX_UNIT_REQUESTED: ${{ needs.plan.outputs.linux_unit }}
          LINUX_UNIT_RESULT: ${{ needs.linux_unit.result }}
          LINUX_GTK_REQUESTED: ${{ needs.plan.outputs.linux_gtk }}
          LINUX_GTK_RESULT: ${{ needs.linux_gtk.result }}
          WINDOWS_REQUESTED: ${{ needs.plan.outputs.windows }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_REQUESTED: ${{ needs.plan.outputs.macos }}
          MACOS_RESULT: ${{ needs.macos.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: python ci/required.py
